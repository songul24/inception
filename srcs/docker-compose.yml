

services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb
    container_name: mariadb
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inception
    restart: unless-stopped

  wordpress:
    build: ./requirements/wordpress
    image: wordpress
    container_name: wordpress
    env_file:
      - .env
    volumes:
      - wp_data:/var/www/wordpress
    depends_on:
      - mariadb
      - redis
    networks:
      - inception
    restart: unless-stopped

  nginx:
    build: ./requirements/nginx
    image: nginx
    container_name: nginx
    env_file:
      - .env
    ports:
      - "443:443"
    volumes:
      - wp_data:/var/www/wordpress
    depends_on:
      - wordpress
    networks:
      - inception
    restart: unless-stopped

  adminer:
    build: ./requirements/bonus/adminer
    image: adminer
    container_name: adminer
    ports:
      - "8081:8080"
    networks:
      - inception
    restart: unless-stopped
    depends_on:
      - mariadb


  redis:
    build: ./requirements/bonus/redis
    image: redis
    container_name: inception-redis
    networks:
      - inception
    restart: unless-stopped


  static_website:
    build: ./requirements/bonus/static_website
    image: static_website
    container_name: inception-static_website
    ports:
      - "122:80"
    networks:
      - inception
    restart: unless-stopped


networks:
  inception:
    driver: bridge

volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/malika/data/mariadb

  wp_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/malika/data/wordpress
